<!DOCTYPE html>

<html lang="zh-CN">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
管理员控制台 ADMIN SYSTEM
</title>


<link rel="stylesheet" href="admin.css">


<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">


</head>




<body>



<!-- CRT -->


<div class="crt-overlay"></div>

<div class="crt-vignette"></div>







<!-- 登录界面 -->


<section id="login-screen">


<div class="admin-window">



<div class="title">


ADMIN_LOGIN.exe


</div>




<h2>

管理员身份验证

</h2>




<input

id="admin-email"

placeholder="管理员账号">


<br>


<input

id="admin-password"

type="password"

placeholder="访问密码">


<br>



<button id="login-btn">


连接主系统


</button>




<p id="login-status">


等待验证...


</p>




</div>


</section>











<!-- 管理后台 -->


<section id="admin-panel"

class="hidden">






<header class="admin-menu">


<div>


◉ ADMIN CONTROL OS


</div>


<nav>


<span>

首页

</span>


<span>

文章管理

</span>


<span>

作品管理

</span>


<span>

评论管理

</span>


<span>

系统设置

</span>


</nav>


</header>









<main>





<!-- 系统状态 -->


<div class="window">



<div class="window-title">

系统状态 SYSTEM STATUS

</div>




<div class="window-content">


<p>

管理员：

陈昊天


</p>


<p>

权限：

ROOT ADMIN


</p>


<p>

数据库：

ONLINE


</p>


</div>


</div>












<!-- 博客发布 -->


<div class="window">


<div class="window-title">


发布文章 BLOG_EDITOR.exe


</div>




<div class="window-content">


<label>

文章标题

</label>



<input

id="post-title"

placeholder="输入标题">


<br>




<label>

文章内容

</label>



<textarea

id="post-content"

placeholder="输入正文">

</textarea>




<br>



<button id="publish-post">


发布文章


</button>



</div>


</div>












<!-- 图片上传 -->


<div class="window">


<div class="window-title">


作品上传 IMAGE_UPLOAD.exe


</div>




<div class="window-content">



<input

type="file"

id="work-image"

accept="image/*">





<input

id="work-title"

placeholder="作品名称">





<textarea

id="work-description"

placeholder="作品描述">

</textarea>




<button id="upload-work">


上传作品


</button>



</div>


</div>












<!-- 评论管理 -->


<div class="window">


<div class="window-title">


评论管理 COMMENT_MANAGER.exe


</div>




<div class="window-content">


<div id="comment-manager">


正在读取评论数据库...


</div>



</div>


</div>












<!-- 网站设置 -->


<div class="window">


<div class="window-title">


系统配置 CONFIG.cfg


</div>



<div class="window-content">



<p>

个人介绍


</p>



<textarea

id="profile-editor">


</textarea>




<button id="save-profile">


保存设置


</button>



</div>


</div>






</main>








</section>








<script src="admin.js"></script>


</body>


</html>
